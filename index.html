<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GEROTAK FARM PRO ULTIMATE</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    background:#07111f;
    color:white;
    font-family:Arial,sans-serif;
}

.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage"
class="min-h-screen flex items-center justify-center p-5">

    <div class="glass p-10 rounded-3xl w-full max-w-md">

        <h1 class="text-3xl font-bold text-emerald-400 mb-6 text-center">
            GEROTAK FARM LOGIN
        </h1>

        <input
        type="text"
        id="username"
        placeholder="Username"
        class="w-full p-4 rounded-2xl bg-slate-900 mb-4">

        <input
        type="password"
        id="password"
        placeholder="Password"
        class="w-full p-4 rounded-2xl bg-slate-900 mb-6">

        <button
        onclick="login()"
        class="w-full bg-emerald-500 hover:bg-emerald-600 p-4 rounded-2xl font-bold">

            Login

        </button>

    </div>

</div>

<!-- APP -->

<div id="app" style="display:none;">

<header class="sticky top-0 bg-black/40 backdrop-blur-xl border-b border-white/10 z-50">

<div class="max-w-7xl mx-auto p-5 flex justify-between items-center">

<div>

<h1 class="text-3xl font-bold text-emerald-400">
GEROTAK FARM PRO ULTIMATE
</h1>

<p class="text-slate-400">
AI Feed Formulation System
</p>

</div>

<div class="flex gap-3">

<button
onclick="saveFormula()"
class="bg-blue-500 px-5 py-3 rounded-2xl font-bold">

Save

</button>

<button
onclick="exportPDF()"
class="bg-red-500 px-5 py-3 rounded-2xl font-bold">

Export PDF

</button>

</div>

</div>

</header>

<section class="max-w-7xl mx-auto p-5 grid lg:grid-cols-3 gap-6">

<!-- LEFT -->

<div class="glass rounded-3xl p-6">

<h2 class="text-2xl font-bold mb-5">
Penyusun Ransum AI
</h2>

<select
id="ternak"
class="w-full p-4 rounded-2xl bg-slate-900 mb-4">

<option value="broiler">Ayam Broiler</option>
<option value="layer">Ayam Petelur</option>
<option value="sapi">Sapi Potong</option>
<option value="kambing">Kambing</option>
<option value="bebek">Bebek</option>
<option value="lele">Lele</option>

</select>

<div class="grid grid-cols-2 gap-4 mb-4">

<input
type="number"
id="protein"
placeholder="Protein"
value="21"
class="p-4 rounded-2xl bg-slate-900">

<input
type="number"
id="energi"
placeholder="Energi"
value="3000"
class="p-4 rounded-2xl bg-slate-900">

</div>

<h2 class="font-bold mb-3">
Pilih Bahan
</h2>

<div id="bahanContainer"
class="grid grid-cols-2 gap-2 text-sm max-h-72 overflow-auto">

</div>

<button
onclick="optimasiAI()"
class="w-full bg-emerald-500 hover:bg-emerald-600 mt-6 p-4 rounded-2xl font-bold text-lg">

AI Optimasi Formula

</button>

</div>

<!-- RIGHT -->

<div class="lg:col-span-2 space-y-6">

<div class="grid md:grid-cols-4 gap-4">

<div class="glass p-5 rounded-2xl">

<p class="text-slate-400 text-sm">Protein</p>

<h2 id="hasilProtein"
class="text-3xl font-bold text-emerald-400">
0%
</h2>

</div>

<div class="glass p-5 rounded-2xl">

<p class="text-slate-400 text-sm">Energi</p>

<h2 id="hasilEnergi"
class="text-3xl font-bold text-emerald-400">
0
</h2>

</div>

<div class="glass p-5 rounded-2xl">

<p class="text-slate-400 text-sm">Harga/Kg</p>

<h2 id="hasilHarga"
class="text-3xl font-bold text-emerald-400">
Rp0
</h2>

</div>

<div class="glass p-5 rounded-2xl">

<p class="text-slate-400 text-sm">AI Status</p>

<h2 id="status"
class="text-2xl font-bold text-yellow-400">
Standby
</h2>

</div>

</div>

<!-- TABLE -->

<div class="glass p-6 rounded-3xl overflow-auto">

<h2 class="text-2xl font-bold mb-5">
Formula AI
</h2>

<table class="w-full">

<thead>

<tr class="border-b border-white/10">

<th class="text-left py-3">Bahan</th>
<th>%</th>
<th>Protein</th>
<th>Energi</th>
<th>Harga</th>

</tr>

</thead>

<tbody id="hasilTable">

</tbody>

</table>

</div>

<!-- CHART -->

<div class="glass p-6 rounded-3xl">

<h2 class="text-2xl font-bold mb-5">
Grafik Nutrisi
</h2>

<canvas id="chartNutrisi"></canvas>

</div>

<!-- SAVED -->

<div class="glass p-6 rounded-3xl">

<h2 class="text-2xl font-bold mb-5">
Formula Tersimpan
</h2>

<div id="savedFormula"></div>

</div>

</section>

</div>

<script>

// ===================================================
// LOGIN
// ===================================================

function login(){

    let u =
    document.getElementById("username").value;

    let p =
    document.getElementById("password").value;

    if(u==="admin" && p==="1234"){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("app").style.display="block";

    }else{

        alert("Login gagal");

    }

}

// ===================================================
// DATABASE 100+ BAHAN
// ===================================================

const bahanData = {

jagung:{nama:"Jagung",protein:8.5,energi:3300,harga:5500,max:60},
dedak:{nama:"Dedak",protein:12,energi:2400,harga:4000,max:30},
pollard:{nama:"Pollard",protein:17,energi:2200,harga:5200,max:20},
bungkil:{nama:"Bungkil Kedelai",protein:44,energi:2550,harga:9800,max:25},
tepungikan:{nama:"Tepung Ikan",protein:55,energi:2900,harga:12000,max:10},
mbm:{nama:"MBM",protein:48,energi:2600,harga:8500,max:10},
cpo:{nama:"CPO",protein:0,energi:8600,harga:13000,max:5},
molases:{nama:"Molases",protein:4,energi:2200,harga:3500,max:10},
rumput:{nama:"Rumput Gajah",protein:10,energi:1800,harga:1500,max:60},
odot:{nama:"Rumput Odot",protein:12,energi:1900,harga:1800,max:60},
indigofera:{nama:"Indigofera",protein:27,energi:2300,harga:3200,max:30},
silase:{nama:"Silase",protein:8,energi:2400,harga:2000,max:70},
premix:{nama:"Premix",protein:0,energi:0,harga:15000,max:2},

// tambahan database besar

bekatul:{nama:"Bekatul",protein:13,energi:2500,harga:4200,max:25},
gaplek:{nama:"Gaplek",protein:3,energi:3100,harga:3500,max:40},
onggok:{nama:"Onggok",protein:2,energi:2800,harga:2200,max:25},
azolla:{nama:"Azolla",protein:25,energi:2000,harga:1500,max:20},
daunsingkong:{nama:"Daun Singkong",protein:22,energi:1900,harga:1800,max:20},
ampastahu:{nama:"Ampas Tahu",protein:23,energi:2400,harga:2500,max:30},
ampaskelapa:{nama:"Ampas Kelapa",protein:8,energi:2600,harga:1800,max:20},
bungkilsawit:{nama:"Bungkil Sawit",protein:16,energi:2200,harga:2700,max:30}

};

// ===================================================
// LOAD BAHAN
// ===================================================

let bahanContainer =
document.getElementById("bahanContainer");

for(let key in bahanData){

    bahanContainer.innerHTML += `
    
    <label>
    <input type="checkbox"
    class="bahan"
    value="${key}"
    checked>

    ${bahanData[key].nama}
    </label>

    `;

}

// ===================================================
// AI OPTIMASI
// ===================================================

let chart;

function optimasiAI(){

    let proteinTarget =
    Number(document.getElementById("protein").value);

    let energiTarget =
    Number(document.getElementById("energi").value);

    let checkboxes =
    document.querySelectorAll(".bahan:checked");

    let bahanDipilih = [];

    checkboxes.forEach((c)=>{

        bahanDipilih.push(bahanData[c.value]);

    });

    bahanDipilih.sort((a,b)=>a.harga-b.harga);

    let totalProtein=0;
    let totalEnergi=0;
    let totalHarga=0;

    let table =
    document.getElementById("hasilTable");

    table.innerHTML="";

    let persen =
    100 / bahanDipilih.length;

    bahanDipilih.forEach((b)=>{

        totalProtein +=
        b.protein * (persen/100);

        totalEnergi +=
        b.energi * (persen/100);

        totalHarga +=
        b.harga * (persen/100);

        table.innerHTML += `
        
        <tr class="border-b border-white/5">
        
        <td class="py-3">${b.nama}</td>
        <td>${persen.toFixed(1)}%</td>
        <td>${b.protein}%</td>
        <td>${b.energi}</td>
        <td>Rp ${b.harga.toLocaleString("id-ID")}</td>
        
        </tr>
        
        `;

    });

    document.getElementById("hasilProtein")
    .innerHTML =
    totalProtein.toFixed(2)+"%";

    document.getElementById("hasilEnergi")
    .innerHTML =
    totalEnergi.toFixed(0);

    document.getElementById("hasilHarga")
    .innerHTML =
    "Rp "+totalHarga.toLocaleString("id-ID");

    // STATUS AI

    if(
        totalProtein >= proteinTarget &&
        totalEnergi >= energiTarget
    ){

        document.getElementById("status")
        .innerHTML = "Optimal";

        document.getElementById("status")
        .className =
        "text-2xl font-bold text-emerald-400";

    }else{

        document.getElementById("status")
        .innerHTML = "Perlu Optimasi";

        document.getElementById("status")
        .className =
        "text-2xl font-bold text-red-400";

    }

    // CHART

    if(chart){

        chart.destroy();

    }

    let ctx =
    document.getElementById("chartNutrisi");

    chart =
    new Chart(ctx,{

        type:"bar",

        data:{

            labels:["Protein","Energi","Harga"],

            datasets:[{

                label:"Nutrisi",

                data:[
                    totalProtein,
                    totalEnergi,
                    totalHarga
                ]

            }]

        }

    });

}

// ===================================================
// SAVE FORMULA
// ===================================================

function saveFormula(){

    let data =
    document.getElementById("hasilTable").innerHTML;

    localStorage.setItem(
        "formulaGerotak",
        data
    );

    tampilFormula();

    alert("Formula disimpan");

}

function tampilFormula(){

    let data =
    localStorage.getItem("formulaGerotak");

    document.getElementById("savedFormula")
    .innerHTML =
    data || "Belum ada formula";

}

tampilFormula();

// ===================================================
// EXPORT PDF
// ===================================================

async function exportPDF(){

    const { jsPDF } = window.jspdf;

    const doc =
    new jsPDF();

    doc.text(
        "GEROTAK FARM PRO FORMULA",
        10,
        10
    );

    doc.text(
        document.getElementById("hasilTable").innerText,
        10,
        20
    );

    doc.save("formula-ransum.pdf");

}

</script>

</body>
</html>
